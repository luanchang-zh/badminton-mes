# 羽毛球 MES 后端公共配置，仅保留与运行环境无关的选项。
# 本地默认启用 dev；部署环境必须显式设置 SPRING_PROFILES_ACTIVE=prod。
spring:
  application:
    name: badminton-mes
  profiles:
    default: dev
  flyway:
    # 数据库结构统一由 Flyway 迁移脚本管理，禁止手工改库
    locations: ${MES_FLYWAY_LOCATIONS:classpath:db/migration}
    # 迁移版本号同时存在整数版(V1~V18)与日期版(V2026071201+)两种方案：
    # 已应用日期版的库再合入新增的整数版脚本时版本号低于已应用最大值，
    # 必须允许乱序应用，否则 validate 阶段直接启动失败
    out-of-order: true
  jpa:
    # Flyway 是唯一建表入口；Hibernate 只负责 ORM，不自动创建或变更表结构
    hibernate:
      ddl-auto: none
    open-in-view: false
  servlet:
    multipart:
      # 容器上限覆盖 RAG 的 20MB 文档；人脸接口仍在业务层限制单张 10MB。
      # 默认总量覆盖三张人脸照片，与 frontend-web/nginx.conf 的 32MB 保持一致。
      max-file-size: ${MES_MULTIPART_MAX_FILE_SIZE:25MB}
      max-request-size: ${MES_MULTIPART_MAX_REQUEST_SIZE:32MB}

server:
  port: ${MES_SERVER_PORT:8080}
  # 来源 IP 取 Nginx 用 $remote_addr 覆盖写入的 X-Real-IP，浏览器无法伪造；
  # 不用 X-Forwarded-For，因为它会保留浏览器自带的值，私网演示环境下会被当作可信代理链采信
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Real-IP
    # 上传超限后 Tomcat 默认只吞掉 2MB 剩余请求体，超出直接断开连接，前端拿不到 JSON 错误
    max-swallow-size: 40MB

mes:
  security:
    # 默认启用认证；仅允许受控的本地开发环境通过环境变量显式关闭
    auth-disabled: ${MES_SECURITY_AUTH_DISABLED:false}
  wechat:
    mini-app:
      app-id: ${MES_WECHAT_MINI_APP_ID:}
      app-secret: ${MES_WECHAT_MINI_APP_SECRET:}
      code-session-url: ${MES_WECHAT_CODE_SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
      access-token-url: ${MES_WECHAT_ACCESS_TOKEN_URL:https://api.weixin.qq.com/cgi-bin/token}
      unlimited-code-url: ${MES_WECHAT_UNLIMITED_CODE_URL:https://api.weixin.qq.com/wxa/getwxacodeunlimit}
      bind-page: ${MES_WECHAT_BIND_PAGE:pages/wechat-bind-confirm/wechat-bind-confirm}
      code-env-version: ${MES_WECHAT_CODE_ENV_VERSION:release}
      # 可选 HTTP 代理。Clash Fake-IP 模式下，Docker 开发环境通过主机桥接端口访问微信 API。
      proxy-host: ${MES_WECHAT_PROXY_HOST:}
      proxy-port: ${MES_WECHAT_PROXY_PORT:0}
      connect-timeout: ${MES_WECHAT_CONNECT_TIMEOUT:3s}
      read-timeout: ${MES_WECHAT_READ_TIMEOUT:5s}
      bind-ticket-ttl: ${MES_WECHAT_BIND_TICKET_TTL:5m}
      bind-result-ttl: ${MES_WECHAT_BIND_RESULT_TTL:10m}
  insightface:
    # Docker 部署经 mes-face 网络访问 http://insightface:8080；宿主机直接运行后端时走本机调试端口
    base-url: ${MES_INSIGHTFACE_BASE_URL:http://127.0.0.1:18097}
    # 与 InsightFace 的 INSIGHTFACE_API_KEY 一致；人脸服务关闭认证时留空，不发送 Authorization 头
    api-key: ${MES_INSIGHTFACE_API_KEY:}
    collection-id: ${MES_INSIGHTFACE_COLLECTION_ID:course_users}
    # MES 判定阈值：发会话前由 MES 自己比较 similarity，修改后重启即生效
    threshold: ${MES_INSIGHTFACE_THRESHOLD:0.4}
    # 召回阈值：每次搜索随请求传给 InsightFace，用于多返回候选计算分差，必须低于 threshold
    recall-threshold: ${MES_INSIGHTFACE_RECALL_THRESHOLD:0.2}
    margin: ${MES_INSIGHTFACE_MARGIN:0.05}
    # 每人样本上限：MES 在锁内预校验，同时写入 Collection 的 max_faces_per_person 作为存储兜底
    max-faces-per-person: ${MES_INSIGHTFACE_MAX_FACES:5}
    connect-timeout: ${MES_INSIGHTFACE_CONNECT_TIMEOUT:3s}
    read-timeout: ${MES_INSIGHTFACE_READ_TIMEOUT:30s}
    face-login:
      ip-fail-max: ${MES_FACE_LOGIN_IP_FAIL_MAX:20}
      ip-fail-window: ${MES_FACE_LOGIN_IP_FAIL_WINDOW:15m}
  erp:
    # mock: 使用内置演示数据；remote: 通过 HTTP 读取真实 ERP 数据
    mode: ${MES_ERP_MODE:mock}
    base-url: ${MES_ERP_BASE_URL:http://localhost:8090}
    task-path: ${MES_ERP_TASK_PATH:/api/mes/tasks}
    craft-path: ${MES_ERP_CRAFT_PATH:/api/mes/crafts}
    connect-timeout: ${MES_ERP_CONNECT_TIMEOUT:3s}
    read-timeout: ${MES_ERP_READ_TIMEOUT:10s}
  report:
    kanban:
      refresh-interval: ${MES_KANBAN_REFRESH_INTERVAL:60000}
  scene:
    completion-sync:
      # 未配置 URL 时使用显式失败客户端，绝不伪造同步成功
      connect-timeout: ${MES_COMPLETION_SYNC_CONNECT_TIMEOUT:15s}
      read-timeout: ${MES_COMPLETION_SYNC_READ_TIMEOUT:30s}
  rag:
    # LightRAG 多租户服务地址；默认指向本机回环，与 lightrag-service 的默认端口一致
    base-url: ${MES_RAG_BASE_URL:http://127.0.0.1:9621}
    # 内部访问密钥，对应上游的 X-API-Key；只允许写入环境变量或本地 .env
    internal-api-key: ${MES_RAG_INTERNAL_API_KEY:}
    connect-timeout: ${MES_RAG_CONNECT_TIMEOUT:3s}
    # 索引与问答可能较慢，读取超时给足
    read-timeout: ${MES_RAG_READ_TIMEOUT:60s}
    # 单次上传允许的最大字节数，默认 20MB
    max-upload-size: ${MES_RAG_MAX_UPLOAD_SIZE:20971520}
    # 流式问答的读取超时：模型逐字输出比整段返回慢，必须单独给足
    stream-read-timeout: ${MES_RAG_STREAM_READ_TIMEOUT:120s}
    # SSE 连接存活上限，须大于 stream-read-timeout，否则流还在生成就被容器断开
    sse-timeout: ${MES_RAG_SSE_TIMEOUT:180s}
