# Independent deployment for this repository; existing factory-app data is untouched.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: badminton_mes
      MYSQL_ROOT_PASSWORD: knowledge-local-root
      MYSQL_USER: mes
      MYSQL_PASSWORD: knowledge-local-mes
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:13308:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -h127.0.0.1 $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      retries: 30
      start_period: 40s
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lightrag
      POSTGRES_USER: lightrag
      POSTGRES_PASSWORD: knowledge-local-pg
    ports: ["127.0.0.1:15434:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/knowledge-local-graph
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["127.0.0.1:17689:7687", "127.0.0.1:17476:7474"]
    volumes: ["graph-data:/data"]
  backend:
    image: eclipse-temurin:21-jre
    command: ["java", "-Xms128m", "-Xmx768m", "-jar", "/app/backend.jar"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MES_DB_URL: jdbc:mysql://mysql:3306/badminton_mes?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
      MES_DB_USERNAME: mes
      MES_DB_PASSWORD: knowledge-local-mes
      MES_REDIS_HOST: redis
      MES_REDIS_PORT: "6379"
      MES_SECURITY_AUTH_DISABLED: "false"
      MES_CORS_ALLOWED_ORIGINS: http://127.0.0.1:18082,http://localhost:18082
      MES_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev-migration
      MES_RAG_BASE_URL: http://host.docker.internal:9622
      MES_RAG_INTERNAL_API_KEY: ${MES_RAG_INTERNAL_API_KEY:?Set .env.knowledge.local first}
      TZ: Asia/Shanghai
    volumes: ["./.codex_tmp/backend.jar:/app/backend.jar:ro"]
    ports: ["127.0.0.1:8082:8080"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  frontend:
    image: nginx:1.28-alpine
    volumes:
      - ./frontend-web/dist:/usr/share/nginx/html:ro
      - ./frontend-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:18082:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  mysql-data:
  redis-data:
  pg-data:
  graph-data:
