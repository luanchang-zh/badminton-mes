":["tenant/validator.py::_check_workspace_names 拒绝空值、含 / 或反斜杠、以及不匹配 ^[A-Za-z0-9_]+$ 的 workspace；单测 test_empty_workspace_message_mentions_global_namespace、test_path_separator_message_is_specific、test_invalid_workspace_rejected（参数化 5 种非法值）与 tests/test_check.py::test_invalid_workspace_fails 覆盖，自检退出码 1。"],"id":"A3","note":"空 workspace 的错误信息直接说明它会退化为全局命名空间。","status":"implemented-with-evidence"},{"evidence":["tenant/validator.py::FORBIDDEN_WORKSPACE_ENV_VARS 覆盖 POSTGRES_WORKSPACE、NEO4J_WORKSPACE、WORKSPACE，命中即拒绝启动；单测 test_forbidden_env_var_rejected 对三个变量参数化断言错误信息含变量名，test_blank_forbidden_env_var_is_ignored 确认空值放行，tests/test_check.py::test_forbidden_env_var_fails 验证自检退出码 1。"],"id":"A4","note":"拒绝依据来自 v1.5.7 源码：postgres_impl.initialize() 与 neo4j_impl.__init__ 都会用环境变量覆盖实例级 workspace。","status":"implemented-with-evidence"},{"evidence":["tenant/registry.py::assemble_registry 为每个租户分别调用 rag_builder 与 doc_manager_builder；单测 tests/test_registry.py::test_two_tenants_get_isolated_contexts 断言 first.rag is not second.rag、各自 workspace 等于配置值、input_dir 分别为 inputs/ws_001 与 inputs/ws_002 且两者不等。"],"id":"A5","note":"目录统一按 <base>/<workspace> 推导，与官方 DocumentManager 规则一致。","status":"implemented-with-evidence"},{"evidence":["tenant/registry.py::TenantRegistry.get 未命中时抛 UnknownTenantError；单测 tests/test_registry.py::test_unknown_tenant_raises_with_user_id 断言异常信息包含 user_unknown；test_register_rejects_duplicate_user_id 断言重复登记直接报错，防止静默覆盖。"],"id":"A6","note":"实现中不存在回退到其他租户实例的分支。","status":"implemented-with-evidence"},{"evidence":["在 lightrag-service 目录执行 python -m pytest：47 passed in 0.22s，退出码 0。用例只读取 YAML、推导路径与使用替身实例，未连接 PostgreSQL/Neo4j、未调用模型 API；tests/test_vendored_source.py 仅做源码文件与文本断言，不导入 lightrag 包。"],"id":"A7","note":"本机未安装 lightrag 依赖，因此单测全程不依赖它。","status":"implemented-with-evidence"},{"evidence":["docker compose -f lightrag-service/docker-compose.yml config 退出码 0；以 --format json 渲染后 services 为 [neo4j, postgres]，两者 environment 中都不含 POSTGRES_WORKSPACE、NEO4J_WORKSPACE、WORKSPACE。"],"id":"A8","note":"compose 文件刻意不注入这三个变量，并在文件头注释写明原因。","status":"implemented-with-evidence"},{"evidence":["渲染结果：postgres ports=[(127.0.0.1, 15432)]，neo4j ports=[(127.0.0.1, 17474), (127.0.0.1, 17687)]；两者 healthcheck 均存在；postgres 挂载命名卷 lightrag-pg-data，neo4j 挂载 lightrag-neo4j-data 与 lightrag-neo4j-logs，三个卷在顶层 volumes 声明。"],"id":"A9","note":"neo4j 健康检查用 cypher-shell RETURN 1 并通过独立 HEALTH_USER/HEALTH_PASSWORD 变量传参，避免在 shell 中拆解 NEO4J_AUTH。","status":"implemented-with-evidence"}],"addressedAcceptanceIds":["A1","A2","A3","A4","A5","A6","A7","A8","A9"],"checks":[{"name":"pytest lightrag-service","note":"47 passed in 0.22s，全程无数据库连接与模型调用","result":"passed"},{"name":"tenant 自检 CLI","note":"默认两租户退出码 0；重复 workspace、空 workspace、含路径分隔符 workspace、POSTGRES_WORKSPACE 四种错误配置均退出码 1","result":"passed"},{"name":"docker compose 静态解析","note":"docker compose -f lightrag-service/docker-compose.yml config 退出码 0，渲染出 postgres 与 neo4j 两个服务","result":"passed"}],"knownLimits":["本机未安装 LightRAG 依赖与真实模型密钥，因此 build_rag/build_llm_func/build_embedding_func 的真实构造路径未执行；自检在模型缺省时降级为只打印配置推导结果。","未启动容器，容器间连通性、pgvector 扩展创建与 Neo4j APOC 实际可用性留待有环境时验证（P2/P3）。","vendored 源码未包含上游 lightrag_webui 前端、docs 文档站与 .github CI 配置，只保留 lightrag 包与安装元数据。"],"requireIndependentReview":true,"summary":"P1 多租户底座已落地。lightrag-service/LightRAG 内 vendored LightRAG v1.5.7 源码（保留 lightrag 包、pyproject.toml、setup.py、MANIFEST.in、LICENSE、README，已删除原仓库 .git），新增 tenant 包的 settings/config/validator/factory/registry/check 六个模块、config/tenants.yaml（2 个演示租户）、47 项 pytest 单测、requirements.txt、.env.example、README.md 以及 docker-compose.yml（PostgreSQL+pgvector、Neo4j+APOC）。workspace 全程显式传参，启动前校验重复标识、命名规则、目录重叠与 POSTGRES_WORKSPACE/NEO4J_WORKSPACE/WORKSPACE 三类覆盖变量。本机验证：pytest 47 passed；python -m tenant.check 对默认两租户退出码 0 并输出互不相同的 input/working 目录，四类错误配置均退出码 1；docker compose config 静态解析成功。","verificationChecks":[{"argv":["-m","pytest"],"cwdRef":"lightrag-service","executable":"python","id":"pytest-lightrag-service","name":"运行 lightrag-service 单测","repeatable":true,"timeoutMs"