ed-with-evidence"},{"evidence":["渲染结果：postgres ports=[(127.0.0.1, 15432)]，neo4j ports=[(127.0.0.1, 17474), (127.0.0.1, 17687)]；两者 healthcheck 均存在；postgres 挂载命名卷 lightrag-pg-data，neo4j 挂载 lightrag-neo4j-data 与 lightrag-neo4j-logs，三个卷在顶层 volumes 声明。"],"id":"A9","note":"neo4j 健康检查用 cypher-shell RETURN 1 并通过独立 HEALTH_USER/HEALTH_PASSWORD 变量传参，避免在 shell 中拆解 NEO4J_AUTH。","status":"implemented-with-evidence"}],"addressedAcceptanceIds":["A1","A2","A3","A4","A5","A6","A7","A8","A9"],"checks":[{"name":"pytest lightrag-service","note":"47 passed in 0.22s，全程无数据库连接与模型调用","result":"passed"},{"name":"tenant 自检 CLI","note":"默认两租户退出码 0；重复 workspace、空 workspace、含路径分隔符 workspace、POSTGRES_WORKSPACE 四种错误配置均退出码 1","result":"passed"},{"name":"docker compose 静态解析","note":"docker compose -f lightrag-service/docker-compose.yml config 退出码 0，渲染出 postgres 与 neo4j 两个服务","result":"passed"}],"knownLimits":["本机未安装 LightRAG 依赖与真实模型密钥，因此 build_rag/build_llm_func/build_embedding_func 的真实构造路径未执行；自检在模型缺省时降级为只打印配置推导结果。","未启动容器，容器间连通性、pgvector 扩展创建与 Neo4j APOC 实际可用性留待有环境时验证（P2/P3）。","vendored 源码未包含上游 lightrag_webui 前端、docs 文档站与 .github CI 配置，只保留 lightrag 包与安装元数据。"],"requireIndependentReview":true,"summary":"P1 多租户底座已落地。lightrag-service/LightRAG 内 vendored LightRAG v1.5.7 源码（保留 lightrag 包、pyproject.toml、setup.py、MANIFEST.in、LICENSE、README，已删除原仓库 .git），新增 tenant 包的 settings/config/validator/factory/registry/check 六个模块、config/tenants.yaml（2 个演示租户）、47 项 pytest 单测、requirements.txt、.env.example、README.md 以及 docker-compose.yml（PostgreSQL+pgvector、Neo4j+APOC）。workspace 全程显式传参，启动前校验重复标识、命名规则、目录重叠与 POSTGRES_WORKSPACE/NEO4J_WORKSPACE/WORKSPACE 三类覆盖变量。本机验证：pytest 47 passed；python -m tenant.check 对默认两租户退出码 0 并输出互不相同的 input/working 目录，四类错误配置均退出码 1；docker compose config 静态解析成功。","verificationChecks":[{"argv":["-m","pytest"],"cwdRef":"lightrag-service","executable":"python","id":"pytest-lightrag-service","name":"运行 lightrag-service 单测","repeatable":true,"timeoutMs":300000},{"argv":["-m","tenant.check"],"cwdRef":"lightrag