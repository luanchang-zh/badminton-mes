    kind: native-spec
    title: 多租户知识库底座（P1）
    snippet: "# 多租户知识库底座（P1）\r

      \r

      ## 能力概述\r

      \r

      本能力回答一个问题：**在真正对外提供 RAG 服务之前，如何用一份可信配置确定\"谁是哪个租户、每个租户用哪个 LightRAG
      实例、数据落在哪个目录\"，并保证配置错误不会悄悄变成跨用户数据混写。**\r

      \r

      能力边界是配置、装配与校验，不含 HTTP 路由、数据库连接与模型调用。\r

      \r

      ## 需求\r

      \r

      ### R1：固定可运行的 LightRAG 源码\r

      \r

      系统 MUST 在 `lightrag-service/LightRAG/` 内提供 LightRAG v1.5.7 源码，且不携带原仓库的 Git
      历史。源码必须以可编辑安装方式被本项目使用，使后续二开改动直接落在本仓库内。\r

      \r

      约束：\r

      \r

      - 目录内不得出现 `.git`；\r

      - 模型与存储的接入参数不写死在源码里，只通过环境变量注入。\r

      \r

      ### R2：声明式租户配置与目录推导\r

      \r

      系统 MUST 从 `config/tenants.yaml` 读取 `user_id → workspace` 映射，并为每个租户推导互不重叠的
      `input_dir` 与 `working_dir`，目录规则为 `<base_dir>/<workspace>`。\r

      \r

      Scenario: 默认两个租户各自拥有独立目录\r

      \  假设配置文件中声明了 2 个租户，worksp"
