ote":"生命周期实现本轮未改动。","status":"implemented-with-evidence"},{"evidence":["tests/test_lifespan.py::test_release_happens_after_background_drain 注入 fake_drain，断言 drain 早于两实例 finalize。","test_shared_state_is_cleaned_last 断言事件序列末项为 shared。"],"id":"A8","note":"顺序固定为 drain → finalize → finalize_share_data。","status":"implemented-with-evidence"},{"evidence":["tests/test_limiter.py::test_peak_concurrency_does_not_exceed_limit 以 limit=3 并发 12 次，断言峰值 ≤ 3；test_exception_releases_slot 断言异常后名额归还。"],"id":"A9","note":"所有租户共用 factory 中的同一限制器。","status":"implemented-with-evidence"},{"evidence":["tests/test_limiter.py::test_unlimited_limiter_is_passthrough 以 limit=None 并发 8 次，断言 limit 为 None 且全部完成。"],"id":"A10","note":"LR_LLM_CONCURRENCY 为 0 或空时解析为 None，不创建信号量。","status":"implemented-with-evidence"},{"evidence":["修复后实测 .env 通道：写 POSTGRES_WORKSPACE=shared 到 lightrag-service/.env，执行 python -m tenant.server --print-routes 退出码 1，输出含 POSTGRES_WORKSPACE，路由行数 0。","进程环境通道同样拒绝；tests/test_dotenv_channel.py::test_postgres_workspace_in_dotenv_is_rejected 断言 code==EXIT_CONFIG_ERROR 且输出无「条路由」。","根因修复：server.main 在读取配置前先 load_dotenv_files()，与上游导入时的 load_dotenv 使用同一份快照。"],"id":"A3","note":"此前 .env 通道漏检，是入口读配置早于 .env 加载造成的配置快照不一致。","status":"implemented-with-evidence"},{"evidence":["修复后实测 .env 通道：LR_INTERNAL_API_KEY=dotenv-secret 写入 .env，ServiceSettings.from_env(None) 读到值 dotenv-secret，说明密钥已进入配置并被传给路由工厂。","同一 .env 下 FastAPI TestClient：不带 X-API-Key 返回 403，错误密钥返回 403。","tests/test_dotenv_channel.py::test_api_key_in_dotenv_reaches_route_registration 断言 .env 密钥确实进入 settings。"],"id":"A4","note":"此前 .env 里的密钥读不到，导致 api_key 为 None、鉴权完全开放。","status":"implemented-with-evidence"},{"evidence":["修复后实测 .env 通道：WHITELIST_PATHS=/* 写入 .env，--print-routes 退出码 1，输出含「全通配」，路由行数 0。","tests/test_dotenv_channel.py::test_catch_all_whitelist_in_dotenv_is_rejected 覆盖；test_named_whitelist_in_dotenv_is_allowed 确认 /health,/api/* 不受影响。","环境变量通道的旧用例 tests/test_server.py 与 tests/test_auth.py 仍全部通过。"],"id":"A6","note":"此前 .env 里的 /* 会绕过启动校验，服务照常开放全部租户路由。","status":"implemented-with-evidence"}],"addressedAcceptanceIds":["A1","A2","A3","A4","A5","A6","A7","A8","A9","A10"],"checks":[{"name":"pytest lightrag-service","note":"82 passed（P1 51 + P2 31），无数据库连接与模型调用","result":"passed"},{"name":".env 通道拒绝启动复核","note":"POSTGRES_WORKSPACE、WHITELIST_PATHS=/* 写进 .env 后均 exit=1 且 0 条路由","result":"passed"},{"name":".env 密钥生效复核","note":"LR_INTERNAL_API_KEY 写进 .env 后进入 settings，TestClient 无密钥/错密钥 403","result":"passed"},{"name":"README 与死代码清理","note":"README 覆盖 --print-routes/启动/鉴权/拒绝启动条件；移除未使用的 EXIT_STARTUP_ERROR","result":"passed"}],"knownLimits":["真实 LightRAG 实例的存储初始化与查询链路仍未在本机执行（需 PostgreSQL/Neo4j 与模型密钥，留给 P3）。","未实际拉起 uvicorn 监听端口，端口可用性与真实 HTTP 往返留待 P3。","/tenant/* 这类前缀白名单同样会让上游免鉴权，当前只拦截全通配（brief 要求范围），已作为后续风险记录。","P1 的包导出契约测试由「完全相等」改为「至少包含」，因为 P2 新增了公开符号。"],"requireIndependentReview":true,"summary":"修复 Verifier 指出的配置快照不一致缺陷（A3/A4/A6）：tenant/server.py 新增 load_dotenv_files()，在 main 中于读取任何配置之前加载 lightrag-service/.env，并抽出 SERVICE_ROOT 常量供 .env 与 vendored 路径共用。这样校验与运行时读到同一份配置快照，.env 里的 POSTGRES_WORKSPACE、LR_INTERNAL_API_KEY、WHITELIST_PATHS=/* 不再能绕过启动校验或让鉴权静默失效。同时补 tests/test_dotenv_channel.py 四项回归用例（同名项目环境变量先清理，并用 dict(os.environ) 作为真实通道来源），并清理死代码 EXIT_STARTUP_ERROR。顺带补齐 Verifier 指出的交付物缺口：README 更新为 P1+P2，补充 --print-routes、启动命令、内部鉴权、拒绝启动条件、生命周期与并发上限说明，目录树补上 P2 六个新模块。验证：pytest 82 passed（原 78 + 新增 4）；三条 .env 通道实测均符合预期。","verificationChecks":[{"argv":["-m","pytest","tests/"],"cwdRef":"lightrag-service","executable":"python","id":"pytest-lightrag-service","name":"运行 lightrag-service 单测","repeatable":true,"timeoutMs":300000},{"argv":["-m","tenant.server","--print-routes"],"cwdRef":"lightrag-service","executable":"python","id":"print-routes","name":"打印租户路由表","repeatable":true,"timeoutMs":180000}]}},{"sequence":4,"value":{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"lightrag-multitenant-server","task":"LightRAG 多租户知识库 P2：多实例 HTTP 服务入口——按租户注册 /tenant/{user_id} 前缀路由、统一 lifespan 生命周期、全局模型并发限流、内部 API Key 鉴权；本机只跑单测与 --print-routes 静态检查"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"构建 2 个租户的应用后，路由表中存在 `/tenant/user_1/...` 与 `/tenant/user_2/...` 两组路由，每组各 33 条，且不存在未加租户前缀的 `/documents/upload`、`/query`、`/graphs`。"},{"id":"A2","source":"brief.md","text":"执行 `python -m tenant.server --print-routes`，输出 2 个租户各自带 `/tenant/<user_id>` 前缀的路由，过程中不连接数据库、不调用模型。"},{"id":"A3","source":"brief.md","text":"租户配置非法（重复 workspace 或设置了 `POSTGRES_WORKSPACE`）时执行 `--print-routes`，进程以非 0 退出码结束且不打印任何路由。"},{"id":"A4","source":"brief.md","text":"请求任一租户路由时不带 `X-API-Key`，或带错误的 `X-API-Key`，响应状态为 401 或 403。"},{"id":"A5","source":"brief.md","text":"请求任一租户路由时带正确的 `X-API-Key`，响应状态不是 401 也不是 403。"},{"id":"A6","source":"brief.md","text":"`WHITELIST_PATHS` 被配置为通配全部路径时，服务拒绝启动且错误信息指出白名单会绕过租户鉴权。"},{"id":"A7","source":"brief.md","text":"应用启动再关闭后，每个租户实例的存储初始化恰好一次、存储释放恰好一次，共享状态清理恰好一次。"},{"id":"A8","source":"brief.md","text":"关闭时若仍有后台任务在运行，实例存储释放发生在等待后台任务结束之后。"},{"id":"A9","source":"brief.md","text":"全局并发上限为 N 时并发发起多于 N 个模型调用，任一时刻正在执行的调用数不超过 N，且全部调用最终完成。"},{"id":"A10","source":"brief.md","text":"未配置全局并发上限时并发发起多个模型调用，调用不被限流阻塞且全部成功完成。"}],"children":null,"formalHash":"46bd7662d0ab660c5cfe1956a9b946e8a7d924c730258041d6c3b51840d6d759","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"5bc2f61d77bada8c74a41647273152581eb562534733d1b96424cc85f01f2928","contractHash":"da636a1896861232c94209ff7541716d163811a663e47bd10d9f39a3cd63f5a6","inputHash":"7d3fcdbde049c2dcb18d52e20cde9f1f722600aa5b71a7bfb91aee78c8b04d93","legacyFingerprint":"27ab224717d470c90a913d2d04e0d6ed8cb7dc2a5242bd8bcd07965da74397bd","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"6a3dd5f2e2c45bc75dcf7b4a692d07b8121e433c413efc32415f9c33a6f33d6f","contractHash":"d74ea45153cf50e4ce720eea3c57e018ac3a7ad3bafdcef1daaa7994ffcffcaf","inputHash":