        peak=2、completed=12；get_shared_limiter 连续两次返回同一实例（第二次入参 99 被忽略，limit 仍为
        2），共享性成立。
      truncated: false
  - id: A10
    source: brief.md
    text: 未配置全局并发上限时并发发起多个模型调用，调用不被限流阻塞且全部成功完成。
    result: passed
