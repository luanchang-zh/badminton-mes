4159ff6a8d0ea0264fc70edf2ff4e66fef7","outcome":{"actionId":"lightrag-multitenant-server:6","attempt":1,"claimToken":"portable-6f055be5d2ae776113a6082867ac6515420dd8980ab1a5fc03357d48744352d6","inputHash":"4e3beceb96eb703ee4a1867b4dc0b4159ff6a8d0ea0264fc70edf2ff4e66fef7","outcomeId":"receipt-80e3b65635308ec3c0a9e5ea0d21b3fa1225e0717e8a1cf253fd33a6528e5bf6","output":{"acceptanceReview":[{"evidence":["python -m tenant.server --print-routes 输出「[user_1] 33 条路由」与「[user_2] 33 条路由」，共 66 行 http:// 路由。","tests/test_app_routes.py::test_each_tenant_has_full_route_set 断言两个租户各 33 条且等于 ROUTES_PER_TENANT；test_no_unprefixed_business_routes 断言未加前缀的 /documents/upload、/query、/graphs 数量为 0。"],"id":"A1","note":"33 = 文档 18 + 查询 3 + 图谱 12，与 v1.5.7 源码统计一致。","status":"implemented-with-evidence"},{"evidence":["命令行执行 python -m tenant.server --print-routes 退出码 0，输出 66 条带 /tenant/<user_id> 前缀的路由；构建阶段用占位实例，未连数据库、未调模型。","tests/test_server.py::test_print_routes_lists_two_tenants 断言输出含两个租户前缀与 documents/upload 路径。"],"id":"A2","note":"占位实例在业务逻辑被调用时会显式报错，因此不会静默掩盖真实调用需求。","status":"implemented-with-evidence"},{"evidence":["重复 workspace 配置：run(['--print-routes','--config',dup]) 返回 exit=1，信息为「workspace 重复：'ws_001' 同时被 user_1 ... 与 user_2 ... 使用」，输出不含「条路由」。","设置 POSTGRES_WORKSPACE=x：exit=1，信息为「禁止设置环境变量 POSTGRES_WORKSPACE」；tests/test_server.py 两项对应用例均断言 code==EXIT_CONFIG_ERROR 且输出无路由。"],"id":"A3","note":"校验在路由注册之前执行，失败时不会构建任何 router。","status":"implemented-with-evidence"},{"evidence":["FastAPI TestClient 实测 GET /tenant/user_1/documents/status_counts：不带 X-API-Key 返回 403；携带错误 X-API-Key 返回 403。","tests/test_auth.py::test_missing_key_is_rejected 与 test_wrong_key_is_rejected 断言状态码属于 (401,403)。"],"id":"A4","note":"状态码由上游 get_combined_auth_dependency 决定，实测为 403。","status":"implemented-with-evidence"},{"evidence":["同一 TestClient 携带正确 X-API-Key 请求同一路径返回 500（占位实例不支持 doc_status），说明请求已通过鉴权进入业务处理，未被 401/403 拦截。","tests/test_auth.py::test_correct_key_is_not_rejected 断言状态码不属于 (401,403)。"],"id":"A5","note":"500 来自占位实例的显式拒绝，而非鉴权失败；真实实例下该路径由上游业务逻辑处理。","status":"implemented-with-evidence"},{"evidence":["WHITELIST_PATHS=/* 时 run(['--print-routes']) 返回 exit=1，信息为「WHITELIST_PATHS 配置为全通配（如 /*），会让 /tenant/* 路由绕过租户鉴权」。","tests/test_auth.py::test_catch_all_whitelist_is_rejected 与 tests/test_server.py::test_catch_all_whitelist_refuses_to_start 覆盖；test_named_whitelist_is_allowed 确认 /health 这类具名白名单不受影响。"],"id":"A6","note":"白名单按本次启动的配置解析，不依赖上游导入时已固化的模块全局变量。","status":"implemented-with-evidence"},{"evidence":["tests/test_lifespan.py::test_each_instance_initialized_and_released_once 用替身记录调用，断言 init:user_1、init:user_2、finalize:user_1、finalize:user_2 各 1 次，shared 清理 1 次。","python -m pytest tests/test_lifespan.py tests/test_limiter.py 结果 9 passed。"],"id":"A7","note":"共享状态清理被替身替换，测试不触碰真实存储。","status":"implemented-with-evidence"},{"evidence":["tests/test_lifespan.py::test_release_happens_after_background_drain 注入 fake_drain 记录事件，断言 drain 的下标小于 finalize:user_1 与 finalize:user_2。","test_shared_state_is_cleaned_last 断言事件序列最后一项是 shared。"],"id":"A8","note":"顺序在实现层固定为 drain → finalize → finalize_share_data，且有单测锁定。","status":"implemented-with-evidence"},{"evidence":["tests/test_limiter.py::test_peak_concurrency_does_not_exceed_limit 以 limit=3 并发 12 次调用，断言实测峰值不超过 3 且 limiter.peak_in_flight <= 3。","test_exception_releases_slot 断言调用抛异常后名额被归还（in_flight 回到 0）且后续调用可继续。"],"id":"A9","note":"限流包在 LLM 与 Embedding 调用层，所有租户共用 factory 里的同一实例。","status":"implemented-with-evidence"},{"evidence":["tests/test_limiter.py::test_unlimited_limiter_is_passthrough 以 limit=None 并发 8 次调用，断言 limiter.limit is None、全部返回且结果完整。","ServiceSettings 中 LR_LLM_CONCURRENCY 为 0 或空时解析为 None，构造 ModelConcurrencyLimiter 时不创建信号量。"],"id":"A10","note":"未配置上限时不引入任何额外等待。","status":"implemented-with-evidence"}],"addressedAcceptanceIds":["A1","A2","A3","A4","A5","A6","A7","A8","A9","A10"],"checks":[{"name":"pytest lightrag-service","note":"78 passed（P1 51 + P2 27），全程无数据库连接与模型调用","result":"passed"},{"name":"--print-routes 输出","note":"两组各 33 条前缀路由，共 66 条，无未加前缀的 documents/query/graphs","result":"passed"},{"name":"配置与安全拒绝启动","note":"重复 workspace、POSTGRES_WORKSPACE、WHITELIST_PATHS=/*、非回环无密钥 四种情况均 exit=1 且不打印路由","result":"passed"},{"name":"鉴权实测","note":"TestClient：无密钥 403、错误密钥 403、正确密钥通过鉴权（500 来自占位实例）","result":"passed"}],"knownLimits":["本机以占位实例验证路由与鉴权；真实 LightRAG 实例的存储初始化、check_and_migrate_data 与查询链路未在本机执行（需 PostgreSQL/Neo4j 与模型密钥，留给 P3）。","未实际拉起 uvicorn 监听端口，端口可用性与真实 HTTP 往返留待 P3。","上游 TestClient 触发 StarletteDeprecationWarning（建议 httpx2），不影响功能。","P1 的包导出契约测试由「完全相等」改为「至少包含」，因为 P2 新增了公开符号。"],"requireIndependentReview":true,"summary":"P2 交付 LightRAG 多实例 HTTP 服务入口：tenant/server.py 提供启动入口与 --print-routes，tenant/app.py 按租户把官方三个路由工厂注册到 /tenant/{user_id}（每租户 33 条），tenant/lifespan.py 统一启停（启动逐个初始化、失败逆序回滚；关闭先等待后台任务再逐个释放，共享状态只清理一次），tenant/llm_limiter.py 用进程内共享 Semaphore 在模型调用层限流，tenant/auth.py 传递内部密钥并在启动期拦截全通配白名单与非回环无密钥。入口在导入 lightrag.api.* 之前固定 sys.argv 并初始化上游配置，避免上游 argparse 抢占命令行；同时补充 placeholder.py 让 --print-routes 在不配模型、不连库的前提下输出真实路由表。验证：pytest 78 passed（P1 51 + P2 27）；--print-routes 输出两组各 33 条前缀路由；非法租户配置、全通配白名单、非回环无密钥均拒绝启动；TestClient 实测无密钥/错误密钥 403、正确密钥通过鉴权。","verificationChecks":[{"argv":["-m","pytest","tests/"],"cwdRef":"lightrag-service","executable":"python","id":"pytest-lightrag-service","name":"运行 lightrag-service 单测","repeatable":true,"timeoutMs":300000},{"argv":["-m","tenant.server","--print-routes"],"cwdRef":"lightrag-service","executable":"python","id":"print-routes","name":"打印租户路由表","repeatable":true,"timeoutMs":180000}]},"status":"succeeded"},"protocolVersion":1,"receipts":[{"hash":"e31ef5d41c1a614269eb1829ab65eb131b5d8e586ce3cbc2fa7d883e6e058a51","outcomeId":"receipt-80e3b65635308ec3c0a9e5ea0d21b3fa1225e0717e8a1cf253fd33a6528e5bf6"}],"reconciliations":[],"ref":"native-builder","requiredCapabilities":[],"retry":"manual","runId":"lightrag-multitenant-server","status":"succeeded","stepId":"build.builder","type":"handoff"},{"attempt":1,"claim":{"executorId":"comet-native-checks","token":"portable-cffc33b5c851ca671c8eb3d9