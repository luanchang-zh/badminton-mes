acceptance:
  - id: A1
    source: brief.md
    text: 构建 2 个租户的应用后，路由表中存在 `/tenant/user_1/...` 与 `/tenant/user_2/...` 两组路由，每组各
      33 条，且不存在未加租户前缀的 `/documents/upload`、`/query`、`/graphs`。
    result: passed
    reason:
      text: 实测 python -m tenant.server --print-routes（lightrag-service 目录、无 .env）退出码
        0。独立脚本按原始行统计：user_1 33 条、user_2 33 条，共 66 条；按 (租户,路径) 分组后无重复项。未加前缀的
        /documents/upload、/query、/graphs 均不存在，所有路径都以 /tenant/ 开头；两租户各自都含
        /tenant/<uid>/documents/upload、/query、/graphs。
      truncated: false
  - id: A2
    source: brief.md
    text: 执行 `python -m tenant.server --print-routes`，输出 2 个租户各自带
      `/tenant/<user_id>` 前缀的路由，过程中不连接数据库、不调用模型。
    result: passed
    reason:
      text: 在 socket.connect / connect_ex / create_connection / getaddrinfo 以及
        psycopg、psycopg2、neo4j、asyncpg、openai 客户端全部被探针替换为「记录并抛错」的条件下执行
        main(['--print-routes'])：退出码 0、输出 66 条 http:// 路由、探针命中列表为空
        []，证明打印过程未建立任何外部连接或模型调用（也不进入 lifespan，未初始化存储）。
      truncated: false
  - id: A3
    source: brief.md
    text: 租户配置非法（重复 workspace 或设置了 `POSTGRES_WORKSPACE`）时执行 `--print-routes`，进程以非 0
      退出码结束且不打印任何路由。
    result: passed
    reason:
      text: 在 lightrag-service 下创建 .env 后执行 python -m tenant.server
        --print-routes：POSTGRES_WORKSPACE=shared → 退出码 1、输出含「禁止设置环境变量
        POSTGRES_WORKSPACE」、路由行数 0；NEO4J_WORKSPACE=shared 与 WORKSPACE=shared
        同样退出码 1、0 条路由；重复 workspace 配置文件同样退出码 1、0 条路由。矩阵脚本在独立子进程并清空同名进程环境变量后复跑 7
        组场景全部符合预期。
      truncated: false
  - id: A4
    source: brief.md
    text: 请求任一租户路由时不带 `X-API-Key`，或带错误的 `X-API-Key`，响应状态为 401 或 403。
    result: passed
    reason:
      text: 对 /tenant/user_1/documents/status_counts 与 /tenant/user_2/... 分别探测：不带
        X-API-Key → 403，携带错误密钥 → 403。.env
        通道（LR_INTERNAL_API_KEY=dotenv-secret-abc）与进程环境通道（proc-env-key）两种来源、两个租户结果一致。
      truncated: false
  - id: A5
    source: brief.md
    text: 请求任一租户路由时带正确的 `X-API-Key`，响应状态不是 401 也不是 403。
    result: passed
    reason:
      text: 以 .env 中的密钥值作为正确密钥请求同一路由 → 500（占位实例不支持 doc_status，异常来自业务层而非鉴权层），不属于
        401/403。走真实 main() 入口（仅替换 uvicorn.run 与实例构造器）复测得同样结果：os.environ 与
        ServiceSettings.from_env(None) 都读到 .env 的密钥，两租户 correct 均为 500。/health
        无密钥 200。
      truncated: false
  - id: A6
    source: brief.md
    text: "`WHITELIST_PATHS` 被配置为通配全部路径时，服务拒绝启动且错误信息指出白名单会绕过租户鉴权。"
    result: passed
    reason:
      text: .env 写 WHITELIST_PATHS=/*（以及 /health,/* 混写）后执行 --print-routes：退出码
        1、输出含「WHITELIST_PATHS 配置为全通配（如 /*），会让 /tenant/* 路由绕过租户鉴权」、路由行数
        0。反向验证：.env 写 WHITELIST_PATHS=/health,/api/* 时退出码 0 且输出 66
        条路由，说明修复没有误杀具名白名单。
      truncated: false
  - id: A7
    source: brief.md
    text: 应用启动再关闭后，每个租户实例的存储初始化恰好一次、存储释放恰好一次，共享状态清理恰好一次。
    result: passed
    reason:
      text: 独立脚本驱动真实 build_lifespan（仅将 finalize_shared_state
        换为记录器，真实清理需要已初始化的共享存储）：启动再关闭后事件序列为 init:user_1, migrate:user_1,
        init:user_2, migrate:user_2, finalize:user_1, finalize:user_2,
        shared；每租户 init 与 finalize 各 1 次，shared 1 次且位于序列末尾。
      truncated: false
  - id: A8
    source: brief.md
    text: 关闭时若仍有后台任务在运行，实例存储释放发生在等待后台任务结束之后。
    result: passed
    reason:
      text: "同一脚本向 app.state.background_tasks 注入真实 asyncio 任务（sleep 0.4s，finally
        记录完成时刻），drain 走真实
        lightrag.kg.shared_storage.drain_reserved_background_tasks（未打桩）。实测
        TASK_DONE_TIME=74040.0705、RELEASE_TIMES=[user_1: 74040.0706, user_2:
        74040.0706]，两次 finalize 均晚于后台任务真正结束的时刻。"
      truncated: false
  - id: A9
    source: brief.md
    text: 全局并发上限为 N 时并发发起多于 N 个模型调用，任一时刻正在执行的调用数不超过 N，且全部调用最终完成。
