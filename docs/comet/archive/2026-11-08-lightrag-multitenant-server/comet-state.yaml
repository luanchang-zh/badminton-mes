tenant-foundation","delta_source":"specs/rag-multitenant-foundation/delta.yaml","operation":"modify","source":"specs/rag-multitenant-foundation/spec.md"},{"capability":"rag-multitenant-server","operation":"create","source":"specs/rag-multitenant-server/spec.md"}]},{"acceptanceReview":[{"evidence":["python -m tenant.server --print-routes 输出「[user_1] 33 条路由」与「[user_2] 33 条路由」，共 66 行 http:// 路由。","tests/test_app_routes.py::test_each_tenant_has_full_route_set 断言两个租户各 33 条且等于 ROUTES_PER_TENANT；test_no_unprefixed_business_routes 断言未加前缀的 /documents/upload、/query、/graphs 数量为 0。"],"id":"A1","note":"33 = 文档 18 + 查询 3 + 图谱 12，与 v1.5.7 源码统计一致。","status":"implemented-with-evidence"},{"evidence":["命令行执行 python -m tenant.server --print-routes 退出码 0，输出 66 条带 /tenant/<user_id> 前缀的路由；构建阶段用占位实例，未连数据库、未调模型。","tests/test_server.py::test_print_routes_lists_two_tenants 断言输出含两个租户前缀与 documents/upload 路径。"],"id":"A2","note":"占位实例在业务逻辑被调用时会显式报错，因此不会静默掩盖真实调用需求。","status":"implemented-with-evidence"},{"evidence":["重复 workspace 配置：run(['--print-routes','--config',dup]) 返回 exit=1，信息为「workspace 重复：'ws_001' 同时被 user_1 ... 与 user_2 ... 使用」，输出不含「条路由」。","设置 POSTGRES_WORKSPACE=x：exit=1，信息为「禁止设置环境变量 POSTGRES_WORKSPACE」；tests/test_server.py 两项对应用例均断言 code==EXIT_CONFIG_ERROR 且输出无路由。"],"id":"A3","note":"校验在路由注册之前执行，失败时不会构建任何 router。","status":"implemented-with-evidence"},{"evidence":["FastAPI TestClient 实测 GET /tenant/user_1/documents/status_counts：不带 X-API-Key 返回 403；携带错误 X-API-Key 返回 403。","tests/test_auth.py::test_missing_key_is_rejected 与 test_wrong_key_is_rejected 断言状态码属于 (401,403)。"],"id":"A4","note":"状态码由上游 get_combined_auth_dependency 决定，实测为 403。","status":"implemented-with-evidence"},{"evidence":["同一 TestClient 携带正确 X-API-Key 请求同一路径返回 500（占位实例不支持 doc_status），说明请求已通过鉴权进入业务处理，未被 401/403 拦截。","tests/test_auth.py::test_correct_key_is_not_rejected 断言状态码不属于 (401,403)。"],"id":"A5","note":"500 来自占位实例的显式拒绝，而非鉴权失败；真实实例下该路径由上游业务逻辑处理。","status":"implemented-with-evidence"},{"evidence":["WHITELIST_PATHS=/* 时 r